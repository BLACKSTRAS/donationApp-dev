<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Donate Alert</title>
<!-- วิธีใช้ http://localhost:3000/widget/alert.html -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap');

  * {
    box-sizing: border-box;
    font-family: 'Prompt', sans-serif;
  }

  body {
    margin: 0;
    background: transparent;
    overflow: hidden;
  }

  .alert-container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .alert-box {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px 36px;
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    border-radius: 20px;
    color: white;
    box-shadow: 0 0 40px rgba(0, 210, 255, 0.6);
    animation: popIn 0.6s ease-out forwards;
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }

  .text {
    display: flex;
    flex-direction: column;
  }

  .name {
    font-size: 28px;
    font-weight: 600;
  }

  .amount {
    font-size: 22px;
    color: #ffe066;
  }

  .message {
    font-size: 18px;
    margin-top: 4px;
    opacity: 0.9;
  }

  @keyframes popIn {
    from {
      transform: scale(0.4);
      opacity: 0;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes fadeOut {
    to {
      transform: scale(0.6);
      opacity: 0;
    }
  }
</style>
</head>

<body>
<div class="alert-container" id="root"></div>

<script>
  function showDonate(data) {
    const root = document.getElementById("root");
    root.innerHTML = "";

    const el = document.createElement("div");
    el.className = "alert-box";
    el.innerHTML = `
      <div class="avatar">💰</div>
      <div class="text">
        <div class="name">${data.name}</div>
        <div class="amount">โดเนท ${data.amount} บาท</div>
        <div class="message">${data.message}</div>
      </div>
    `;

    root.appendChild(el);

    setTimeout(() => {
      el.style.animation = "fadeOut 0.5s ease-in forwards";
    }, 5000);
  }

  setTimeout(() => {
    showDonate({
      name: "Mark",
      amount: 100,
      message: "สู้ ๆ นะครับ ❤️"
    });
  }, 1000);
</script>
</body>
</html>
